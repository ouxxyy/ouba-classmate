<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 420px; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e6edf3;
    background:
      radial-gradient(640px 320px at 88% 12%, rgba(163, 113, 247, .16), transparent 62%),
      radial-gradient(560px 300px at 10% 95%, rgba(88, 166, 255, .13), transparent 62%),
      #0d1117;
  }
  .wrap { width: 100%; height: 100%; padding: 58px 64px; display: flex; align-items: center; justify-content: space-between; }
  .left { max-width: 660px; }
  .kicker { font-size: 14px; letter-spacing: .38em; color: #8b949e; margin-bottom: 20px; font-weight: 600; }
  h1 { font-size: 58px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; }
  h1 .accent { color: #a371f7; }
  .formula { margin-top: 26px; font-size: 21px; color: #c9d1d9; font-weight: 500; }
  .formula b { color: #58a6ff; font-weight: 600; margin: 0 2px; }
  .tagline { margin-top: 12px; font-size: 15px; color: #8b949e; letter-spacing: .06em; }
  .right { display: flex; flex-direction: column; gap: 16px; }
  .card {
    border: 1px solid #30363d; background: rgba(22, 27, 34, .88);
    border-radius: 12px; padding: 16px 24px; min-width: 320px;
    display: flex; align-items: center; gap: 16px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .card .name { font-size: 20px; font-weight: 600; }
  .card .sub { font-size: 12.5px; color: #8b949e; margin-top: 3px; letter-spacing: .04em; }
  .count { margin-left: auto; font-size: 17px; color: #8b949e; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="kicker">OUBA CLASSMATE &middot; OPEN SOURCE</div>
      <h1>欧八同学<span class="accent"> · 项目合集</span></h1>
      <div class="formula">职业定位 <b>&times;</b> AI 杠杆 <b>&times;</b> 涨薪方法</div>
      <div class="tagline">AI 独立开发者 &middot; 9 个原创项目，一个页面找齐</div>
    </div>
    <div class="right">
      <div class="card">
        <span class="dot" style="background:#f0883e"></span>
        <span><div class="name">职场 · 跳槽涨薪</div><div class="sub">测风险 · 改简历 · 练面试 · 查公司</div></span>
        <span class="count">&times;4</span>
      </div>
      <div class="card">
        <span class="dot" style="background:#a371f7"></span>
        <span><div class="name">AI Skill</div><div class="sub">装进你的 Agent</div></span>
        <span class="count">&times;3</span>
      </div>
      <div class="card">
        <span class="dot" style="background:#3fb950"></span>
        <span><div class="name">本地工具</div><div class="sub">装在自己电脑</div></span>
        <span class="count">&times;2</span>
      </div>
    </div>
  </div>
</body>
</html>

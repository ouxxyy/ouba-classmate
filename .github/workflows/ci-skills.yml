name: Validate Skills & Project Index

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 skills/ 目录 SKILL.md frontmatter
        run: python3 scripts/sync_skills.py --check

      - name: 运行索引单元测试
        run: python3 -m unittest discover -s tests

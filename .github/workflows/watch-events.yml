name: Watch Skill Ecosystem Events

on:
  schedule:
    # 每天 UTC 02:00 扫描 GitHub 上近期高增长的中文/求职/视频分镜 Skill 动态，供 P5 事件响应参考
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: 扫描近期热门 Agent Skills 与求职工具动态
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import datetime as dt
          import json
          import urllib.parse
          import urllib.request

          since = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=14)).strftime("%Y-%m-%d")
          queries = [
              f"skill in:name,description created:>{since} stars:>20",
              f"claude-skill OR agent-skill pushed:>{since} stars:>30",
              f"resume skill OR 求职 skill pushed:>{since} stars:>5",
          ]
          print(f"=== Event Radar Scan (since {since}) ===")
          for q in queries:
              url = "https://api.github.com/search/repositories?sort=stars&order=desc&per_page=5&q=" + urllib.parse.quote(q)
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "ouba-event-radar"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              print(f"\nQuery: {q}")
              for item in data.get("items", []):
                  print(f"  ★ {item['stargazers_count']:4d} | {item['full_name']} | {item.get('description') or ''}")
          EOF
